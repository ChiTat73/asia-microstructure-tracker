<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microstructure Initiative Ledger</title>
    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-card: #111622;
            --text-primary: #f1f5f9;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top Header Structure */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .title-area h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 6px 0;
            letter-spacing: -0.3px;
        }

        .title-area p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }

        /* Search Filter Box */
        .search-box {
            position: relative;
        }

        .search-box input {
            background-color: #151b26;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 16px 10px 36px;
            border-radius: 6px;
            font-size: 13px;
            width: 260px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #475569;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            opacity: 0.4;
        }

        /* Institutional Ledger Table styling */
        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            background-color: transparent;
        }

        .ledger-table th {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .ledger-table tr {
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .ledger-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .ledger-table td {
            padding: 20px 16px;
            vertical-align: middle;
            line-height: 1.4;
        }

        /* Column Specific Rules */
        .col-exchange {
            font-weight: 700;
            width: 10%;
            letter-spacing: 0.3px;
        }

        .col-initiative {
            font-weight: 600;
            width: 50%;
        }

        .col-eta {
            font-weight: 700;
            font-size: 13px;
            white-space: pre-line;
            width: 18%;
        }

        .col-category {
            width: 18%;
        }

        .col-arrow {
            width: 4%;
            text-align: right;
            color: var(--text-muted);
            font-size: 16px;
            opacity: 0.5;
        }

        /* Status Pills & Indicators */
        .category-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(16, 185, 129, 0.06);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 600;
        }

        /* Adaptive categories coloring matching terminal visuals */
        .category-wrapper.trading-hours { color: #10b981; background: rgba(16, 185, 129, 0.05); }
        .category-wrapper.market-infrastructure { color: #06b6d4; background: rgba(6, 182, 212, 0.05); }
        .category-wrapper.trading-mechanics { color: #a3e635; background: rgba(163, 230, 53, 0.05); }
        .category-wrapper.settlement-mechanics { color: #fbbf24; background: rgba(251, 191, 36, 0.05); }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        /* Footer info */
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        .loading-text {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Controls Row -->
        <div class="header-bar">
            <div class="title-area">
                <h1>Microstructure Initiative Ledger</h1>
                <p>Click any row to inspect its market impact profile</p>
            </div>
            <div class="search-box">
                <input type="text" id="tableFilter" placeholder="Filter by exchange or category...">
            </div>
        </div>

        <!-- Terminal Output View Layer -->
        <table class="ledger-table">
            <thead>
                <tr>
                    <th style="padding-left:16px;">Exchange</th>
                    <th>Initiative Name</th>
                    <th>ETA</th>
                    <th>Category</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="ledger-body">
                <tr>
                    <td colspan="5" class="loading-text">Synchronizing secure terminal feeds...</td>
                </tr>
            </tbody>
        </table>

        <footer>
            Data streamed live from the Asia microstructure tracking source. For institutional use only.
        </footer>
    </div>

    <script>
        let fullDataset = [];

        // Fetch direct code elements from JSON log stream
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                fullDataset = data;
                renderTable(fullDataset);
            })
            .catch(error => {
                document.getElementById('ledger-body').innerHTML = `
                    <tr><td colspan="5" class="loading-text" style="color:#ef4444;">⚠️ Network Error: Stream synchronization broken.</td></tr>
                `;
                console.error('Error parsing dataset stream:', error);
            });

        // Dynamic Table Render Loop Engine
        function renderTable(dataset) {
            const tbody = document.getElementById('ledger-body');
            tbody.innerHTML = '';

            if(dataset.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="loading-text">No active initiatives match your criteria.</td></tr>`;
                return;
            }

            dataset.forEach(item => {
                const tr = document.createElement('tr');
                
                // Clicking a row displays full clean alert context natively 
                tr.onclick = () => {
                    alert(`[IMPACT REPORT - ${item.exchange || 'ALERT'}]\n\nInitiative:\n${item.initiative || 'N/A'}\n\nDetailed Market Impact:\n${item.impact || 'No operational impact logged.'}\n\nStatus Context:\nTimeline Status: ${item.timeline_status || 'N/A'}\nSeverity Rating: ${item.severity_level || 'N/A'}`);
                };

                // Standardize category tracking for CSS layout matches
                const categoryClean = (item.category || '').toLowerCase().replace(/\s+/g, '-');

                tr.innerHTML = `
                    <td class="col-exchange">${item.exchange || 'N/A'}</td>
                    <td class="col-initiative">${item.initiative || 'Untitled System Update'}</td>
                    <td class="col-eta">${item.eta || 'Rolling Phase'}</td>
                    <td class="col-category">
                        <div class="category-wrapper ${categoryClean}">
                            <div class="status-dot"></div>
                            <span>${item.category || 'General'}</span>
                        </div>
                    </td>
                    <td class="col-arrow">›</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Live Real-Time Search Filter Functionality
        document.getElementById('tableFilter').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const filtered = fullDataset.filter(item => {
                return (item.exchange || '').toLowerCase().includes(query) || 
                       (item.category || '').toLowerCase().includes(query) ||
                       (item.initiative || '').toLowerCase().includes(query);
            });
            renderTable(filtered);
        });
    </script>
</body>
</html>
