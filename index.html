<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microstructure Initiative Ledger</title>
    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-card: #111622;
            --text-primary: #f1f5f9;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top Header Structure */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .title-area h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 6px 0;
            letter-spacing: -0.3px;
        }

        .title-area p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }

        /* Controls Area (Switch + Search) */
        .controls-area {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Terminal-style Segmented Switch */
        .status-switch {
            display: flex;
            background-color: #151b26;
            border: 1px solid var(--border-color);
            padding: 2px;
            border-radius: 6px;
        }

        .switch-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .switch-btn:hover {
            color: var(--text-primary);
        }

        .switch-btn.active {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        /* Search Filter Box */
        .search-box {
            position: relative;
        }

        .search-box input {
            background-color: #151b26;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 16px 10px 36px;
            border-radius: 6px;
            font-size: 13px;
            width: 240px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #475569;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            opacity: 0.4;
        }

        /* Institutional Ledger Table styling */
        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            background-color: transparent;
        }

        .ledger-table th {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .ledger-table tr {
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .ledger-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .ledger-table td {
            padding: 20px 16px;
            vertical-align: middle;
            line-height: 1.4;
        }

        /* Column Specific Rules */
        .col-exchange {
            font-weight: 700;
            width: 10%;
            letter-spacing: 0.3px;
        }

        .col-initiative {
            font-weight: 600;
            width: 50%;
        }

        .col-eta {
            font-weight: 700;
            font-size: 13px;
            white-space: pre-line;
            width: 18%;
        }

        .col-category {
            width: 18%;
        }

        .col-arrow {
            width: 4%;
            text-align: right;
            color: var(--text-muted);
            font-size: 16px;
            opacity: 0.5;
        }

        /* Status Pills & Indicators */
        .category-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(16, 185, 129, 0.06);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 600;
        }

        /* Adaptive categories coloring matching terminal visuals */
        .category-wrapper.trading-hours { color: #10b981; background: rgba(16, 185, 129, 0.05); }
        .category-wrapper.market-infrastructure { color: #06b6d4; background: rgba(6, 182, 212, 0.05); }
        .category-wrapper.trading-mechanics { color: #a3e635; background: rgba(163, 230, 53, 0.05); }
        .category-wrapper.settlement-mechanics { color: #fbbf24; background: rgba(251, 191, 36, 0.05); }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        /* Footer info */
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        .loading-text {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Controls Row -->
        <div class="header-bar">
            <div class="title-area">
                <h1>Microstructure Initiative Ledger</h1>
                <p>Click any row to inspect its market impact profile</p>
            </div>
            
            <div class="controls-area">
                <!-- Status Segmented Switch -->
                <div class="status-switch">
                    <button class="switch-btn active" onclick="filterByTimeline('all', this)">All</button>
                    <button class="switch-btn" onclick="filterByTimeline('implemented', this)">Implemented</button>
                    <button class="switch-btn" onclick="filterByTimeline('pipeline', this)">Pipeline</button>
                </div>
                
                <!-- Search Box -->
                <div class="search-box">
                    <input type="text" id="tableFilter" placeholder="Filter ledger content...">
                </div>
            </div>
        </div>

        <!-- Terminal Output View Layer -->
        <table class="ledger-table">
            <thead>
                <tr>
                    <th style="padding-left:16px;">Exchange</th>
                    <th>Initiative Name</th>
                    <th>ETA</th>
                    <th>Category</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="ledger-body">
                <tr>
                    <td colspan="5" class="loading-text">Synchronizing secure terminal feeds...</td>
                </tr>
            </tbody>
        </table>

        <footer>
            Data streamed live from the Asia microstructure tracking source. For institutional use only.
        </footer>
    </div>

    <script>
        let fullDataset = [];
        let currentTimelineFilter = 'all';

        // Fetch dataset elements from JSON stream log with cache-busting path
        fetch('./data.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                fullDataset = data;
                applyCombinedFilters();
            })
            .catch(error => {
                document.getElementById('ledger-body').innerHTML = `
                    <tr><td colspan="5" class="loading-text" style="color:#ef4444;">⚠️ Network Error: Stream synchronization broken.</td></tr>
                `;
                console.error('Error parsing dataset stream:', error);
            });

        // Combined Filter Processing Core Engine
        function applyCombinedFilters() {
            const searchQuery = document.getElementById('tableFilter').value.toLowerCase();
            
            const filteredData = fullDataset.filter(item => {
                // 1. Evaluate Segmented Switch Condition
                const etaText = (item.eta || '').toLowerCase();
                const statusText = (item.timeline_status || '').toLowerCase();
                
                // Matches items explicitly marked historical or containing "implemented" in the ETA line
                const isImplemented = statusText.includes('historical') || etaText.includes('implemented');
                
                if (currentTimelineFilter === 'implemented' && !isImplemented) return false;
                if (currentTimelineFilter === 'pipeline' && isImplemented) return false;

                // 2. Evaluate Search Text Box Condition
                return (item.exchange || '').toLowerCase().includes(searchQuery) || 
                       (item.category || '').toLowerCase().includes(searchQuery) ||
                       (item.initiative || '').toLowerCase().includes(searchQuery);
            });

            renderTable(filteredData);
        }
