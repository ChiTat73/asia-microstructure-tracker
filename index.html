<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microstructure Initiative Ledger</title>
    <style>
        :root {
            --bg-main: #0b0f17;
            --text-primary: #f1f5f9;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --accent-green: #10b981;
        }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-main); color: var(--text-primary); padding: 40px 24px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #111622; border: 1px solid var(--border-color); padding: 30px; border-radius: 8px; margin-top: 20px; }
        .btn { background: #151b26; border: 1px solid var(--border-color); color: white; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #1e293b; }
        pre { text-align: left; background: #000; padding: 15px; border-radius: 4px; overflow-x: auto; color: #a3e635; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Microstructure Ledger Diagnostics</h1>
        <p style="color: var(--text-muted)">Testing data connectivity configuration...</p>
        
        <div class="card">
            <h3>System Status:</h3>
            <p id="test-status" style="font-weight: bold; color: #fbbf24;">Attempting to download data records...</p>
            <button class="btn" onclick="location.reload()">Manual Reload</button>
        </div>

        <div class="card" style="text-align: left;">
            <h3>Raw Data Output Stream:</h3>
            <pre id="raw-stream">Awaiting stream packets...</pre>
        </div>
    </div>

    <script>
        // Directly targets data.json using root fallback paths
        fetch('data.json')
            .then(res => {
                if(!res.ok) throw new Error("File found, but server block active. Code: " + res.status);
                return res.json();
            })
            .then(data => {
                document.getElementById('test-status').textContent = "✅ Success! File loaded correctly.";
                document.getElementById('test-status').style.color = "#10b981";
                document.getElementById('raw-stream').textContent = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById('test-status').textContent = "❌ Failed to read data.json";
                document.getElementById('test-status').style.color = "#ef4444";
                document.getElementById('raw-stream').textContent = err.message + "\n\nTip: Go to your main GitHub screen and verify that a file named exactly 'data.json' exists in your files list.";
            });
    </script>
</body>
</html>
