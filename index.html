<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Microstructure Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            padding: 30px;
        }
        h2 {
            color: #0366d6;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 12px;
        }
        th {
            background-color: #f6f8fa;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .loading {
            text-align: center;
            font-weight: bold;
            color: #666666;
            padding: 30px;
        }
    </style>
</head>
<body>

    <h2>Asia Microstructure Data Table</h2>

    <table id="data-table">
        <thead>
            <tr>
                <th>Exchange</th>
                <th>Initiative</th>
                <th>ETA</th>
                <th>Category</th>
                <th>Impact</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr>
                <td colspan="5" class="loading">Loading data from data.json...</td>
            </tr>
        </tbody>
    </table>

    <script>
        // Directly fetch the local raw JSON data array
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = ''; // Clear out the loading message

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="loading">Database is empty.</td></tr>';
                    return;
                }

                // Loop through your python scraper keys securely
                data.forEach(item => {
                    const row = document.createElement('tr');
                    
                    // Fallback to capital letters if your script changes properties
                    const exchange = item.exchange || item.EXCHANGE || 'N/A';
                    const initiative = item.initiative || item.INITIATIVE || 'N/A';
                    const eta = item.eta || item.ETA || 'N/A';
                    const category = item.category || item.CATEGORY || 'N/A';
                    const impact = item.impact || item.IMPACT || 'N/A';

                    row.innerHTML = `
                        <td><strong>${exchange}</strong></td>
                        <td>${initiative}</td>
                        <td>${eta}</td>
                        <td>${category}</td>
                        <td>${impact}</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(error => {
                document.getElementById('table-body').innerHTML = `
                    <tr><td colspan="5" class="loading" style="color: red;">❌ Failed to load file data.json. Error: ${error.message}</td></tr>
                `;
            });
    </script>

</body>
</html>
